<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 高斯预览</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a09; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 52%, rgba(49,88,255,.23), transparent 38%); }
  canvas { display: block; position: relative; z-index: 1; }
  #hud { position: fixed; z-index: 4; left: 18px; bottom: 16px; color: #8c8c85;
    font: 700 10px/1.4 Arial, sans-serif; letter-spacing: .07em; pointer-events: none; }
  #loading, #error { position: fixed; z-index: 5; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #aaa9a1; font: 12px Arial, sans-serif; gap: 16px; }
  #spinner { width: 48px; height: 48px; border: 2px solid #34342f; border-top-color: #e8ff42;
    border-radius: 50%; animation: spin .8s linear infinite; }
  #error { display: none; padding: 32px; color: #ff7358; text-align: center; white-space: pre-wrap; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading"><div id="spinner"></div><div>正在载入高斯模型…</div></div>
<div id="error"></div>
<div id="hud">拖动旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://unpkg.com/@sparkjsdev/spark@2.0.0/dist/spark.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const params = new URLSearchParams(location.search);
const plyURL = params.get("ply");
const loadingEl = document.getElementById("loading");
const errorEl = document.getElementById("error");

function fail(message) {
  loadingEl.style.display = "none";
  errorEl.style.display = "flex";
  errorEl.textContent = message;
}

if (!plyURL) fail("没有收到模型文件地址。");
else init(plyURL);

function init(url) {
  try {
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(0, 0.28, 1.9);

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.075;
    controls.minDistance = 0.18;
    controls.maxDistance = 50;

    const splat = new SplatMesh({ url });
    const root = new THREE.Group();
    root.add(splat);
    splat.rotation.y = Math.PI / 2;
    root.rotation.x = Math.PI;
    scene.add(root);

    let frameCount = 0;
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
      frameCount += 1;
      if (frameCount === 6) loadingEl.style.display = "none";
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    setTimeout(() => { loadingEl.style.display = "none"; }, 5000);
  } catch (error) {
    fail("模型载入失败：" + (error instanceof Error ? error.message : "未知错误"));
  }
}
</script>
</body>
</html>
