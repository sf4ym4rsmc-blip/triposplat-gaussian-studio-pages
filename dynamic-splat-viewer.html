<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4D 动态高斯预览</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a09; color: white; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 52%, rgba(255,90,54,.18), transparent 40%); }
  canvas { display: block; position: relative; z-index: 1; }
  #badge { position: fixed; z-index: 4; left: 18px; top: 17px; padding: 7px 9px;
    border: 1px solid rgba(232,255,66,.5); color: #e8ff42;
    font: 900 9px/1 Arial, sans-serif; letter-spacing: .12em; pointer-events: none; }
  #hud { position: fixed; z-index: 4; right: 18px; top: 19px; color: #8c8c85;
    font: 700 9px/1.4 Arial, sans-serif; letter-spacing: .07em; pointer-events: none; }
  #timeline { position: fixed; z-index: 5; left: 50%; bottom: 18px; width: min(620px, calc(100% - 36px));
    padding: 14px 16px; display: grid; grid-template-columns: 44px 1fr auto; gap: 13px; align-items: center;
    border: 1px solid rgba(255,255,255,.2); background: rgba(16,16,15,.9); backdrop-filter: blur(14px); }
  #toggle { height: 34px; border: 1px solid #e8ff42; background: #e8ff42; color: #10100f;
    cursor: pointer; font: 900 15px/1 Arial, sans-serif; }
  #scrubber { width: 100%; accent-color: #ff5a36; cursor: pointer; }
  #time { min-width: 78px; color: #b5b5ae; text-align: right; white-space: nowrap;
    font: 800 9px/1 Arial, sans-serif; letter-spacing: .07em; }
  #loading, #error { position: fixed; z-index: 7; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #aaa9a1; background: #0a0a09;
    font: 12px Arial, sans-serif; gap: 16px; }
  #spinner { width: 48px; height: 48px; border: 2px solid #34342f; border-top-color: #ff5a36;
    border-radius: 50%; animation: spin .8s linear infinite; }
  #error { display: none; padding: 32px; color: #ff7358; text-align: center; white-space: pre-wrap; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 560px) {
    #hud { display: none; }
    #timeline { grid-template-columns: 40px 1fr; }
    #time { grid-column: 2; text-align: left; }
  }
</style>
</head>
<body>
<div id="loading"><div id="spinner"></div><div id="loading-copy">正在载入 4D 高斯序列…</div></div>
<div id="error"></div>
<div id="badge">4D SEQUENCE · BETA</div>
<div id="hud">拖动旋转 · 滚轮缩放 · 右键平移</div>
<div id="timeline">
  <button id="toggle" type="button" aria-label="播放或暂停">Ⅱ</button>
  <input id="scrubber" type="range" min="0" max="0" step="1" value="0" aria-label="时间帧">
  <span id="time">FRAME 01 / 01</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://unpkg.com/@sparkjsdev/spark@2.0.0/dist/spark.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const params = new URLSearchParams(location.search);
const loadingEl = document.getElementById("loading");
const loadingCopy = document.getElementById("loading-copy");
const errorEl = document.getElementById("error");
const toggle = document.getElementById("toggle");
const scrubber = document.getElementById("scrubber");
const timeEl = document.getElementById("time");

function fail(message) {
  loadingEl.style.display = "none";
  errorEl.style.display = "flex";
  errorEl.textContent = message;
}

let urls;
try {
  urls = JSON.parse(params.get("frames") || "[]");
} catch {
  urls = [];
}
const requestedFps = Number(params.get("fps"));
const fps = Number.isFinite(requestedFps) ? Math.max(.5, Math.min(12, requestedFps)) : 2;

if (!Array.isArray(urls) || urls.length === 0 || urls.some((url) => typeof url !== "string")) {
  fail("没有收到可播放的高斯时间帧。");
} else {
  init(urls);
}

function init(frameUrls) {
  try {
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .01, 1000);
    camera.position.set(0, .28, 1.9);
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = .075;
    controls.minDistance = .18;
    controls.maxDistance = 50;

    const root = new THREE.Group();
    root.rotation.x = Math.PI;
    scene.add(root);
    const splats = frameUrls.map((url, index) => {
      loadingCopy.textContent = `正在载入时间帧 ${index + 1} / ${frameUrls.length}…`;
      const splat = new SplatMesh({ url });
      splat.rotation.y = Math.PI / 2;
      splat.visible = index === 0;
      root.add(splat);
      return splat;
    });

    scrubber.max = String(splats.length - 1);
    let activeFrame = 0;
    let playing = true;
    let elapsed = 0;
    let previousTime = performance.now();

    function showFrame(index) {
      const next = Math.max(0, Math.min(splats.length - 1, index));
      splats[activeFrame].visible = false;
      splats[next].visible = true;
      activeFrame = next;
      scrubber.value = String(next);
      timeEl.textContent = `FRAME ${String(next + 1).padStart(2, "0")} / ${String(splats.length).padStart(2, "0")}`;
    }

    function setPlaying(next) {
      playing = next;
      toggle.textContent = playing ? "Ⅱ" : "▶";
      toggle.setAttribute("aria-label", playing ? "暂停" : "播放");
      previousTime = performance.now();
    }

    toggle.addEventListener("click", () => setPlaying(!playing));
    scrubber.addEventListener("input", () => {
      setPlaying(false);
      showFrame(Number(scrubber.value));
    });
    addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        setPlaying(!playing);
      }
    });

    let renderFrames = 0;
    renderer.setAnimationLoop((now) => {
      controls.update();
      if (playing && splats.length > 1) {
        elapsed += now - previousTime;
        const frameDuration = 1000 / fps;
        if (elapsed >= frameDuration) {
          const advance = Math.max(1, Math.floor(elapsed / frameDuration));
          showFrame((activeFrame + advance) % splats.length);
          elapsed %= frameDuration;
        }
      }
      previousTime = now;
      renderer.render(scene, camera);
      renderFrames += 1;
      if (renderFrames === 8) loadingEl.style.display = "none";
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    setTimeout(() => { loadingEl.style.display = "none"; }, 7000);
    showFrame(0);
  } catch (error) {
    fail("4D 序列载入失败：" + (error instanceof Error ? error.message : "未知错误"));
  }
}
</script>
</body>
</html>
